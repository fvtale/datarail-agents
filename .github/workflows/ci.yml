name: CI

# Nothing in this repo is built or run on the author's machine, so this
# workflow is the only thing that ever executes the code before it answers a
# real client. Treat a red run as a broken receptionist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The cron job pins one version; the range catches anything that would
        # break when the runner image moves.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check datarail_agents dashboard tests

      - name: Import every module
        # Catches syntax errors and bad imports in the paths tests do not
        # reach, such as the SMTP and IMAP code.
        run: |
          python -c "import datarail_agents, datarail_agents.core.config, datarail_agents.core.leads, datarail_agents.core.policy, datarail_agents.core.knowledge, datarail_agents.core.brain, datarail_agents.core.calendar, datarail_agents.core.booking, datarail_agents.email_agent.mailbox, datarail_agents.email_agent.run; print('all modules import')"

      - name: Test
        run: python -m pytest -q

      - name: Knowledge base loads
        run: python -c "from datarail_agents.core import knowledge; print(len(knowledge.load()), 'characters of knowledge')"

      - name: Dashboard renders with no leads
        # The empty state is the one a first deploy actually hits.
        run: |
          mkdir -p /tmp/site/leads
          python dashboard/build.py --site /tmp/site
          grep -q "No leads yet" /tmp/site/public/leads/index.html
          echo "empty dashboard renders"

      - name: Dashboard renders with a lead
        run: |
          mkdir -p /tmp/site2/leads
          cat > /tmp/site2/leads/data.json <<'JSON'
          {
            "schema_version": 1,
            "generated_at": "2026-09-09T12:00:00+00:00",
            "count": 1,
            "leads": [{
              "id": "abc123",
              "created_at": "2026-09-09T11:00:00+00:00",
              "updated_at": "2026-09-09T12:00:00+00:00",
              "source": "email",
              "contact": {"name": "Sam Reed", "email": "sam@example.com", "phone": "", "company": "Acme"},
              "need": "a booking site", "scope": "", "budget": "under 5k",
              "timeline": "within a month", "decision_maker": "yes",
              "summary": "Wants a booking form for a small studio.",
              "score": 80, "status": "qualified",
              "open_questions": ["Does she already have a domain?"],
              "interactions": [{"at": "2026-09-09T11:00:00+00:00", "source": "email",
                "direction": "in", "subject": "Booking form", "body": "Can you build one?",
                "message_id": "<x@y>"}],
              "thread_ids": ["<x@y>"],
              "booking": {"status": "booked",
                "slot": {"start": "2026-09-15T18:00:00+00:00", "end": "2026-09-15T18:30:00+00:00"},
                "offered_slots": [], "offered_at": "2026-09-09T11:05:00+00:00",
                "event_id": "evt_1", "booked_at": "2026-09-09T12:00:00+00:00"}
            }]
          }
          JSON
          python dashboard/build.py --site /tmp/site2
          grep -q "Sam Reed" /tmp/site2/public/leads/index.html
          grep -q "qualified" /tmp/site2/public/leads/index.html
          grep -q "Intro call booked" /tmp/site2/public/leads/index.html
          echo "populated dashboard renders, with the booking"

      - name: A lead written before booking existed still loads
        # The store predates the booking field. Older rows must not crash the
        # dashboard or the agent.
        run: |
          mkdir -p /tmp/site3/leads
          cat > /tmp/site3/leads/data.json <<'JSON'
          {"schema_version": 1, "generated_at": "2026-09-09T12:00:00+00:00", "count": 1,
           "leads": [{"id": "old1", "created_at": "2026-09-01T00:00:00+00:00",
            "updated_at": "2026-09-01T00:00:00+00:00", "source": "email",
            "contact": {"name": "Old Lead", "email": "old@example.com", "phone": "", "company": ""},
            "summary": "From before booking existed.", "score": 25, "status": "qualifying",
            "open_questions": [], "interactions": [], "thread_ids": []}]}
          JSON
          python dashboard/build.py --site /tmp/site3
          grep -q "Old Lead" /tmp/site3/public/leads/index.html
          python -c "
          from datarail_agents.core.leads import LeadStore
          store = LeadStore.open('/tmp/site3/leads/data.json')
          lead = store.leads[0]
          assert lead.booking.status == 'none', lead.booking
          store.save()
          print('legacy lead round-trips with a default booking')
          "

      - name: Raw lead data never lands in the served directory
        # The store is deliberately outside public/ so it cannot be fetched
        # over HTTP even if the .htaccess is wrong or never uploads. If a
        # refactor ever moves it back, this fails instead of leaking quietly.
        run: |
          if find /tmp/site2/public -name '*.json' | grep -q .; then
            echo "::error title=Lead data in public/::A .json file was written under public/. The lead store must stay outside public/ so it is never uploaded."
            find /tmp/site2/public -name '*.json'
            exit 1
          fi
          echo "public/ contains no JSON: raw lead data stays private"
