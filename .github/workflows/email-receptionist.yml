name: Email receptionist

# Polls contact@datarail.org, answers genuine enquiries, records leads, and
# pushes the result to datarail-site -- whose own deploy workflow then ships
# the dashboard to IONOS.
#
# Scheduled runs do nothing until the repository variable DATARAIL_AGENT_LIVE is
# set to 'true'; until then the agent only runs when started by hand, and a
# manual run is a dry run unless 'live' is ticked too. Setting the variable to
# anything else, or deleting it, silences the agent on the next run without a
# code change. That is the kill switch.

on:
  schedule:
    # Every 30 minutes. GitHub queues cron jobs and can run them late under
    # load, so treat this as "about twice an hour", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Actually send replies (otherwise dry run)"
        type: boolean
        default: false
      doctor:
        description: "Only check credentials, models and mailbox, then stop"
        type: boolean
        default: false

# One run at a time. Two passes over the same INBOX would both read the same
# unread mail and both reply to it.
concurrency:
  group: email-receptionist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  receptionist:
    runs-on: ubuntu-latest
    steps:
      # This runs first, before any checkout, because the datarail-site
      # checkout needs a token that may not exist yet either.
      - name: Check for credentials
        id: creds
        # Until the secrets exist, skip instead of failing red -- the same way
        # datarail-site's deploy workflow waits for its IONOS credentials. A
        # cron that goes red every 30 minutes teaches you to ignore it, which
        # is the last thing you want from the workflow answering your mail.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAIL_PASSWORD: ${{ secrets.DATARAIL_MAIL_PASSWORD }}
          SITE_TOKEN: ${{ secrets.DATARAIL_SITE_TOKEN }}
          GLYPH_KEY: ${{ secrets.GLYPH_DEPLOY_KEY }}
          EVENT: ${{ github.event_name }}
          LIVE_VAR: ${{ vars.DATARAIL_AGENT_LIVE }}
        run: |
          # A scheduled run does nothing until the agent is switched on. A dry
          # run never files or marks mail, so on a 30-minute cron it would
          # re-read, re-classify and re-draft the same unread messages 48 times
          # a day -- paying for every call, appending a duplicate interaction to
          # each lead, and pushing (and so redeploying) datarail-site each time.
          # Dry runs are for reading, so they are manual: Run workflow.
          if [ "$EVENT" = "schedule" ] && [ "$LIVE_VAR" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Waiting to go live::Scheduled runs wait for DATARAIL_AGENT_LIVE=true. Use Run workflow for a dry run."
            exit 0
          fi

          # Written as if-statements rather than `[ -z "$X" ] && ...` because
          # under `bash -e` an AND-list whose first command returns 1 fails the
          # whole step -- which would mean the check breaks precisely when the
          # secret IS set.
          missing=""
          if [ -z "$OPENAI_API_KEY" ]; then missing="$missing OPENAI_API_KEY"; fi
          if [ -z "$MAIL_PASSWORD" ]; then missing="$missing DATARAIL_MAIL_PASSWORD"; fi
          if [ -z "$SITE_TOKEN" ]; then missing="$missing DATARAIL_SITE_TOKEN"; fi

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Receptionist not configured::Missing secret(s):$missing. Add them under Settings > Secrets and variables > Actions, then run this workflow with 'doctor' ticked. Skipping this run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All credentials present."
          fi

          # Optional, like the calendar. Without it the receptionist runs as
          # before and listing mail simply waits, unread, until the key exists.
          if [ -n "$GLYPH_KEY" ]; then
            echo "glyph=true" >> "$GITHUB_OUTPUT"
          else
            echo "glyph=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Glyph intake off::GLYPH_DEPLOY_KEY is not set, so listing mail is left unread for now."
          fi

      - name: Check out the agents
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Check out datarail-site
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: fvtale/datarail-site
          # A fine-grained PAT with Contents: read and write on datarail-site.
          # The default GITHUB_TOKEN cannot reach another repository.
          token: ${{ secrets.DATARAIL_SITE_TOKEN }}
          path: site

      - name: Check out Glyph
        if: steps.creds.outputs.ready == 'true' && steps.creds.outputs.glyph == 'true'
        uses: actions/checkout@v5
        with:
          repository: fvtale/glyph
          # A deploy key with write access on fvtale/glyph. It can push a
          # listings/* branch and nothing more: Glyph's own workflow judges the
          # branch and opens the pull request, so this key never needs to. It
          # does not expire, which a PAT on a job that runs forever would.
          ssh-key: ${{ secrets.GLYPH_DEPLOY_KEY }}
          path: glyph

      - name: Set up Python
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide whether this run may send
        if: steps.creds.outputs.ready == 'true'
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          LIVE_VAR: ${{ vars.DATARAIL_AGENT_LIVE }}
          LIVE_INPUT: ${{ github.event.inputs.live }}
        run: |
          # A manual run can send only if it asked to AND the variable allows
          # it. Two switches, so neither one alone starts the agent talking.
          if [ "$LIVE_VAR" = "true" ] && { [ "$EVENT" = "schedule" ] || [ "$LIVE_INPUT" = "true" ]; }; then
            echo "flag=--live" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live::The agent will send replies."
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dry run::Nothing will be sent. Set the repository variable DATARAIL_AGENT_LIVE to 'true' to go live."
          fi

      - name: Doctor
        if: steps.creds.outputs.ready == 'true' && github.event.inputs.doctor == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATARAIL_MAIL_PASSWORD: ${{ secrets.DATARAIL_MAIL_PASSWORD }}
          DATARAIL_MAIL_ADDRESS: ${{ vars.DATARAIL_MAIL_ADDRESS }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_CLASSIFIER_MODEL: ${{ vars.OPENAI_CLASSIFIER_MODEL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          DATARAIL_TIMEZONE: ${{ vars.DATARAIL_TIMEZONE }}
          GLYPH_ROOT: ${{ steps.creds.outputs.glyph == 'true' && 'glyph' || '' }}
        run: python -m datarail_agents.email_agent.run --doctor --site site

      - name: Run the receptionist
        if: steps.creds.outputs.ready == 'true' && github.event.inputs.doctor != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATARAIL_MAIL_PASSWORD: ${{ secrets.DATARAIL_MAIL_PASSWORD }}
          DATARAIL_MAIL_ADDRESS: ${{ vars.DATARAIL_MAIL_ADDRESS }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_CLASSIFIER_MODEL: ${{ vars.OPENAI_CLASSIFIER_MODEL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          DATARAIL_TIMEZONE: ${{ vars.DATARAIL_TIMEZONE }}
          DATARAIL_DISCLOSE_AGENT: ${{ vars.DATARAIL_DISCLOSE_AGENT }}
          DATARAIL_MAX_SENDS_PER_RUN: ${{ vars.DATARAIL_MAX_SENDS_PER_RUN }}
          DATARAIL_MAX_LISTINGS_PER_RUN: ${{ vars.DATARAIL_MAX_LISTINGS_PER_RUN }}
          GLYPH_ROOT: ${{ steps.creds.outputs.glyph == 'true' && 'glyph' || '' }}
        run: python -m datarail_agents.email_agent.run --site site ${{ steps.mode.outputs.flag }}

      - name: Rebuild the dashboard
        if: steps.creds.outputs.ready == 'true' && github.event.inputs.doctor != 'true'
        run: python dashboard/build.py --site site

      - name: Push leads to datarail-site
        if: steps.creds.outputs.ready == 'true' && github.event.inputs.doctor != 'true'
        working-directory: site
        run: |
          # leads/ is the private store, public/leads/ is the served dashboard.
          if [ -z "$(git status --porcelain leads public/leads)" ]; then
            echo "No lead changes to push."
            exit 0
          fi
          git config user.name "DataRail receptionist"
          git config user.email "contact@datarail.org"
          git add leads public/leads
          git commit -m "Leads: update from the email receptionist"
          # Another run, or a human, may have pushed since checkout. Rebase
          # rather than force: losing a lead to a race is not acceptable.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Confirm the dashboard is not public
        if: steps.creds.outputs.ready == 'true' && github.event.inputs.doctor != 'true'
        # The dashboard page has client details inlined in it. If basic auth is
        # not working, that page is readable by anyone who guesses the URL, and
        # this job should go red until it is fixed. A 401 or 403 is the pass;
        # anything else, including a 200, is a leak.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://datarail.org/leads/ || echo "000")
          case "$code" in
            401|403)
              echo "Dashboard is protected (HTTP $code)." ;;
            000)
              echo "::warning title=Could not check::datarail.org did not respond. Not treating this as a failure." ;;
            404)
              echo "::notice title=Not deployed yet::/leads/ returned 404. It will appear after the next site deploy." ;;
            *)
              echo "::error title=Dashboard is publicly readable::https://datarail.org/leads/ returned HTTP $code instead of 401. Client data is exposed. Fix AuthUserFile in public/leads/.htaccess -- see the comments in that file."
              exit 1 ;;
          esac
